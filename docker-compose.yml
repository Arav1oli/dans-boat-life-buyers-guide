services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dans_boat_guide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - boat-guide-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dans_boat_guide"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dans_boat_guide
      PUBLIC_GUIDE_URL: http://localhost:8000/guide/
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  boat-guide-postgres:
