services:
  - type: web
    name: dans-boat-life-guide-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: python -m backend.init_db
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_GUIDE_URL
        value: https://arav1oli.github.io/dans-boat-life-buyers-guide/guide/
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
